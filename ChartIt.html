function updateHeaderSetting(key, value) {
  S.dashHeader[key] = value;
  renderDashHeader();
  if (currentSettingsId === '__dashHeader') openHeaderSettings();
}

function renderWidgets() {
  renderDashHeader();
  const grid = document.getElementById('widgetGrid');
  grid.innerHTML = '';

  let maxBottom = 0;
  S.widgets.forEach(w => {
    if (!w.pos) assignDefaultPosition(w);

    const el = document.createElement('div');
    el.className = 'widget';
    el.id = w.id;
    el.style.left = w.pos.x + 'px';
    el.style.top = w.pos.y + 'px';
    el.style.width = w.pos.w + 'px';
    el.style.height = w.pos.h + 'px';
    el.style.zIndex = w.pos.z || 1;

    const cc = w.config;
    el.style.background = cc.bgColor || '#ffffff';
    el.style.borderColor = cc.borderColor || '#e0d8cf';
    el.style.borderWidth = (cc.borderWidth != null ? cc.borderWidth : 1) + 'px';
    el.style.borderStyle = 'solid';
    el.style.borderRadius = (cc.borderRadius != null ? cc.borderRadius : 10) + 'px';
    el.style.boxShadow = SHADOW_MAP[cc.shadow || 'sm'] || SHADOW_MAP.sm;
    if (cc.bgColor && cc.bgColor.includes('rgba')) el.style.backdropFilter = 'blur(8px)';

    const handle = document.createElement('div');
    handle.className = 'widget-handle';
    if (cc.hideHeader) handle.style.display = 'none';
    if (cc.headerBg && cc.headerBg !== 'transparent') handle.style.background = cc.headerBg;
    if (cc.headerBorder === false) handle.style.borderBottom = 'none';
    const hColor = cc.headerColor || '#2D231C';
    const hAlign = cc.headerAlign || 'left';
    handle.innerHTML = `<span class="grip" style="color:${hColor}55">⠿</span><h4 style="font-family:${cc.fontFamily||'Inter'};color:${hColor};text-align:${hAlign}">${cc.title||'Untitled'}</h4><div class="widget-actions"><button onclick="copyWidgetToClipboard('${w.id}')" title="Copy to clipboard" style="color:${hColor}88">📋</button><button onclick="bringToFront('${w.id}')" title="Bring to front" style="color:${hColor}88">▲</button><button onclick="sendToBack('${w.id}')" title="Send to back" style="color:${hColor}88">▼</button><button onclick="openSettings('${w.id}')" title="Settings" style="color:${hColor}88">⚙</button><button onclick="duplicateWidget('${w.id}')" title="Duplicate" style="color:${hColor}88">⧉</button><button class="delete-btn" onclick="deleteWidget('${w.id}')" title="Delete">✕</button></div>`;
    handle.addEventListener('mousedown', e => dragMouseDown(e, w.id));
    el.appendChild(handle);

    if (w.type === 'text') {
      const body = document.createElement('div');
      body.className = 'text-body' + (cc.hideHeader ? ' no-header' : '');
      const content = document.createElement('div');
      content.className = 'text-content';
      content.contentEditable = 'true';
      content.setAttribute('data-placeholder', 'Click to type...');
      content.style.fontFamily = cc.fontFamily || 'Inter';
      content.style.fontSize = (cc.fontSize || 14) + 'px';
      content.style.color = cc.textColor || cc.headerColor || '#2D231C';
      content.style.fontWeight = cc.bold ? '700' : (cc.fontWeight || '400');
      content.style.fontStyle = cc.italic ? 'italic' : 'normal';
      content.style.textAlign = cc.textAlign || 'left';
      if (cc.textContent) content.innerHTML = cc.textContent;
      content.addEventListener('input', () => { w.config.textContent = content.innerHTML; });
      content.addEventListener('mousedown', e => e.stopPropagation());
      body.appendChild(content);
      el.appendChild(body);
    } else if (w.type === 'kpi') {
      const body = document.createElement('div'); body.className='kpi-body';
      const gfExpr = resolveGlobalFormula(w.config.metric);
      const effectiveFormula = (w.config.formula && w.config.formula.trim()) ? w.config.formula : gfExpr;
      if (!w.config.metric && !effectiveFormula) {
        body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-secondary);font-size:12px;">Select a metric in settings</div>';
      } else {
        const wRows = getWidgetRows(w);
        let val, subtitle;
        if (effectiveFormula) {
          try { val = evalFormulaOnRows(effectiveFormula, wRows, w.config.agg); }
          catch(e) { val = NaN; }
          const gfName = gfExpr ? (S.globalFormulas.find(f=>'gf:'+f.id===w.config.metric)||{}).name||'formula' : 'formula';
          subtitle = `${w.config.agg} of ${gfExpr ? gfName : 'formula'} · ${wRows.length} rows`;
        } else {
          const fn = aggFn(w.config.agg);
          val = fn(wRows, w.config.metric);
          subtitle = `${w.config.agg} of ${w.config.metric} · ${wRows.length} rows`;
        }
        const colorStyle = `color:${w.config.accentColor||'var(--text-primary)'}`;
        const subColor = w.config.headerColor || 'var(--text-secondary)';
        const hasCustomFmt = w.config.valPrefix || w.config.valSuffix || w.config.valDecimals != null || w.config.valCompact;
        const displayVal = isNaN(val) ? 'Error' : hasCustomFmt ? buildChartFormatter(w.config)(val) : fmtVal(val, w.config.format);
        body.innerHTML = `<div class="kpi-value" style="${colorStyle};font-family:${w.config.fontFamily||'Inter'};font-size:${w.config.fontSize||26}px">${displayVal}</div>`;
      }
      el.appendChild(body);
    } else if (w.type === 'table') {
      const body = document.createElement('div');
      body.className = 'table-widget-body';
      body.style.height = 'calc(100% - 42px)';
      body.style.overflow = 'auto';
      body.style.fontFamily = w.config.fontFamily || 'Inter';
      body.style.fontSize = (w.config.fontSize || 11) + 'px';
      renderTableWidget(w, body);
      el.appendChild(body);
    } else {
      const body = document.createElement('div'); body.className='chart-body';
      body.style.height = 'calc(100% - 42px)';
      const canvas = document.createElement('canvas');
      canvas.id = 'canvas-'+w.id;
      body.appendChild(canvas);
      el.appendChild(body);
    }

    const resizer = document.createElement('div');
    resizer.className = 'widget-resize';
    resizer.addEventListener('mousedown', e => resizeMouseDown(e, w.id));
    el.appendChild(resizer);

    grid.appendChild(el);
    maxBottom = Math.max(maxBottom, w.pos.y + w.pos.h);

    if (w.type === 'chart') renderChartWidget(w);
  });

  grid.style.minHeight = (maxBottom + 80) + 'px';
}

function assignDefaultPosition(w) {
  const grid = document.getElementById('widgetGrid');
  const gw = grid ? grid.clientWidth : 900;
  const GAP = 16;
  const isKpi = w.type === 'kpi';
  const isText = w.type === 'text';
  const isTable = w.type === 'table';
  const colW = isText ? Math.floor((gw - GAP) / 2) : isKpi ? Math.floor((gw - GAP * 3) / 4) : Math.floor((gw - GAP) / 2);
  const h = isText ? 60 : isKpi ? 110 : isTable ? 360 : (w.config.chartHeight || 300) + 42;

  const existing = S.widgets.filter(ww => ww.pos).map(ww => ww.pos);
  let x = 0, y = 0;

  function overlaps(px, py, pw, ph) {
    return existing.some(p => px < p.x + p.w && px + pw > p.x && py < p.y + p.h && py + ph > p.y);
  }

  for (let row = 0; row < 50; row++) {
    for (let col = 0; col < (isKpi ? 4 : 2); col++) {
      x = col * (colW + GAP);
      y = row * (h + GAP);
      if (!overlaps(x, y, colW, h)) {
        w.pos = { x, y, w: colW, h, z: 1 };
        return;
      }
    }
  }
  w.pos = { x: 0, y: (existing.length ? Math.max(...existing.map(p => p.y + p.h)) + GAP : 0), w: colW, h, z: 1 };
}

function bringToFront(id) {
  const maxZ = Math.max(...S.widgets.map(w => (w.pos && w.pos.z) || 1));
  const w = S.widgets.find(w => w.id === id);
  if (w && w.pos) { w.pos.z = maxZ + 1; document.getElementById(id).style.zIndex = w.pos.z; }
}
function sendToBack(id) {
  const minZ = Math.min(...S.widgets.filter(w=>w.pos).map(w=>w.pos.z||1));
  const w = S.widgets.find(w => w.id === id);
  if (w && w.pos) { w.pos.z = Math.max(1, minZ - 1); document.getElementById(id).style.zIndex = w.pos.z; }
}

function isNumericCol(col, sampleRows) {
  if (METRIC_COLS.includes(col)) return true;
  let numCount = 0, total = 0;
  for (let i = 0; i < Math.min(sampleRows.length, 50); i++) {
    const v = sampleRows[i][col];
    if (v == null || v === '') continue;
    total++;
    if (!isNaN(parseFloat(v)) && v !== true && v !== false) numCount++;
  }
  return total > 0 && numCount / total > 0.7;
}

function renderTableWidget(w, container) {
  const c = w.config;
  let wRows = getWidgetRows(w);
  const wCols = getWidgetCols(w);
  const validCol = col => S.allCols.includes(col) || wCols.includes(col) || col === '__market' || col === '__media' || col === '__sheet';
  let cols = (c.columns && c.columns.length) ? c.columns.filter(validCol) : [];
  if (!cols.length) {
    container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-secondary);font-size:12px;">Select columns in settings to display data</div>';
    return;
  }
  const nonMetaCols = cols.filter(cc => !cc.startsWith('__'));
  if (nonMetaCols.length) {
    wRows = wRows.filter(r => nonMetaCols.some(cc => r[cc] != null && r[cc] !== ''));
  }
  if (!wRows.length) {
    container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-secondary);font-size:12px;">No data — load files or adjust filters</div>';
    return;
  }

  if (c.columnOrder && c.columnOrder.length) {
    const ordered = c.columnOrder.filter(co => cols.includes(co));
    cols.filter(co => !ordered.includes(co)).forEach(co => ordered.push(co));
    cols = ordered;
  } else {
    const textCols = cols.filter(col => !isNumericCol(col, wRows));
    const numCols = cols.filter(col => isNumericCol(col, wRows));
    cols = [...textCols, ...numCols];
  }

  let rows;
  const metaLabels = { __market:'Market', __media:'Media Type', __sheet:'Sheet' };
  const rawMode = c.rawMode === true;

  if (!rawMode) {
    const dimCols = cols.filter(col => !isNumericCol(col, wRows));
    const numCols = cols.filter(col => isNumericCol(col, wRows));
    const defaultAgg = c.agg || 'sum';

    if (dimCols.length > 0 && numCols.length > 0) {
      const groups = {};
      wRows.forEach(r => {
        const key = dimCols.map(dc => String(r[dc] ?? '')).join('|||');
        if (!groups[key]) groups[key] = { _keys: dimCols.map(dc => r[dc] ?? ''), _rows: [] };
        groups[key]._rows.push(r);
      });
      rows = Object.values(groups).map(g => {
        const row = {};
        dimCols.forEach((dc, i) => row[dc] = g._keys[i]);
        numCols.forEach(nc => {
          const colAgg = (c.aggMetrics || []).find(am => am.col === nc);
          const fn = aggFn(colAgg ? (colAgg.agg || defaultAgg) : defaultAgg);
          row[nc] = fn(g._rows, nc);
        });
        return row;
      });
    } else {
      rows = [...wRows];
    }
  } else {
    rows = [...wRows];
  }

  if (c.sortCol && cols.includes(c.sortCol)) {
    rows.sort((a, b) => {
      let va = a[c.sortCol] ?? '', vb = b[c.sortCol] ?? '';
      const na = parseFloat(va), nb = parseFloat(vb);
      if (!isNaN(na) && !isNaN(nb)) return c.sortAsc ? na - nb : nb - na;
      return c.sortAsc ? String(va).localeCompare(String(vb)) : String(vb).localeCompare(String(va));
    });
  }

  const maxR = c.maxRows || 25;
  const dispRows = rows.slice(0, maxR);
  const numericCols = cols.filter(col => isNumericCol(col, rows));
  const compactMode = c.valCompact || 'never';
  const uniformScale = (compactMode === 'auto' || compactMode === 'always') ? detectUniformScale(rows, numericCols) : null;
  const fmtNum = buildChartFormatter(c, uniformScale);
  const striped = c.stripedRows !== false;
  const compact = c.compactMode;
  const pad = compact ? '3px 6px' : '6px 10px';

  const showNums = c.showRowNumbers;
  const colWidths = c.colWidths || {};
  const thStyle = `position:sticky;top:0;background:#f8fafc;padding:${pad};text-align:left;font-weight:600;font-size:${Math.max((c.fontSize||11)-1,8)}px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.4px;border-bottom:2px solid var(--border);cursor:pointer;white-space:nowrap;user-select:none;position:relative;`;
  let html = '<table style="width:100%;border-collapse:collapse;font-size:inherit;table-layout:fixed;">';
  html += '<thead><tr>';
  if (showNums) html += `<th style="position:sticky;top:0;background:#f8fafc;padding:${pad};text-align:center;font-weight:600;font-size:${Math.max((c.fontSize||11)-1,8)}px;color:var(--text-secondary);border-bottom:2px solid var(--border);width:32px;">#</th>`;
  cols.forEach((col, ci) => {
    const cfLabel = (c.colFormats && c.colFormats[col] && c.colFormats[col].displayName) ? c.colFormats[col].displayName : null;
    const label = cfLabel || metaLabels[col] || col;
    const arrow = c.sortCol === col ? (c.sortAsc ? ' ↑' : ' ↓') : '';
    const hasFormat = c.colFormats && c.colFormats[col];
    const fmtDot = hasFormat ? '<span style="color:var(--accent);margin-left:3px;font-size:8px;">●</span>' : '';
    const wStr = colWidths[col] ? `width:${colWidths[col]}px;min-width:${colWidths[col]}px;max-width:${colWidths[col]}px;` : '';
    html += `<th draggable="true" data-wid="${w.id}" data-col="${col.replace(/"/g,'&quot;')}" data-ci="${ci}" style="${thStyle}${wStr}overflow:hidden;text-overflow:ellipsis;" onclick="sortTableWidget('${w.id}','${col.replace(/'/g,"\\'")}')" oncontextmenu="event.preventDefault();showColCtxMenu('${w.id}','${col.replace(/'/g,"\\'")}',event.clientX,event.clientY)" ondragstart="tableColDragStart(event)" ondragover="tableColDragOver(event)" ondrop="tableColDrop(event)" ondragend="tableColDragEnd(event)">${label}${arrow}${fmtDot}<div class="th-resize-handle" onmousedown="tableColResizeStart(event,'${w.id}','${col.replace(/'/g,"\\'")}')"></div></th>`;
  });
  html += '</tr></thead><tbody>';

  const totalRow = () => {
    const tBg = c.totalBg || '#f1f0ed';
    const tColor = c.totalColor || '';
    const tBold = c.totalBold !== false ? 'font-weight:700;' : '';
    const tColorStyle = tColor ? `color:${tColor};` : '';
    let tr = `<tr style="background:${tBg};${tBold}${tColorStyle}border-top:2px solid var(--border);">`;
    if (showNums) tr += `<td style="padding:${pad};"></td>`;
    const tAgg = c.totalAgg || 'sum';
    cols.forEach((col, ci) => {
      const isN = isNumericCol(col, rows);
      if (ci === 0 && !isN) {
        tr += `<td style="padding:${pad};font-size:${Math.max((c.fontSize||11)-1,8)}px;text-transform:uppercase;letter-spacing:.3px;color:var(--text-secondary);">${c.totalLabel||'Total'}</td>`;
      } else if (isN) {
        const fn = aggFn(tAgg);
        const total = fn(rows, col);
        const colFmt = c.colFormats && c.colFormats[col] ? buildColFormatter(c.colFormats[col], fmtNum) : null;
        tr += `<td style="padding:${pad};text-align:right;font-variant-numeric:tabular-nums;">${colFmt ? colFmt(total) : fmtNum(total)}</td>`;
      } else {
        tr += `<td style="padding:${pad};"></td>`;
      }
    });
    tr += '</tr>';
    return tr;
  };

  if (c.showTotal && c.totalPos === 'top') html += totalRow();
  dispRows.forEach((r, ri) => {
    const bg = striped && ri % 2 === 1 ? 'background:#faf9f7;' : '';
    html += `<tr style="${bg}">`;
    if (showNums) html += `<td style="padding:${pad};border-bottom:1px solid #f1f5f9;text-align:center;color:var(--text-secondary);font-size:${Math.max((c.fontSize||11)-1,8)}px;">${ri+1}</td>`;
    cols.forEach(col => {
      const rawV = r[col] ?? '';
      const renames = c.valueRenames && c.valueRenames[col];
      const v = renames && renames[String(rawV)] != null ? renames[String(rawV)] : rawV;
      const n = parseFloat(rawV);
      const isN = !isNaN(n) && rawV !== '' && rawV !== true && rawV !== false;
      const align = isN ? 'text-align:right;font-variant-numeric:tabular-nums;' : '';
      const colFmt = c.colFormats && c.colFormats[col] ? buildColFormatter(c.colFormats[col], fmtNum) : null;
      const display = isN ? (colFmt ? colFmt(n) : fmtNum(n)) : v;
      const safeV = String(rawV).replace(/'/g,"\\'").replace(/"/g,'&quot;');
      const tdW = colWidths[col] ? `width:${colWidths[col]}px;min-width:${colWidths[col]}px;max-width:${colWidths[col]}px;overflow:hidden;text-overflow:ellipsis;` : '';
      html += `<td style="padding:${pad};border-bottom:1px solid #f1f5f9;white-space:nowrap;${align}${tdW}cursor:context-menu;" oncontextmenu="event.preventDefault();showValCtxMenu('${w.id}','${col.replace(/'/g,"\\'")}','${safeV}',event.clientX,event.clientY)">${display}</td>`;
    });
    html += '</tr>';
  });
  if (c.showTotal && c.totalPos !== 'top') html += totalRow();
  html += '</tbody></table>';
  if (rows.length > maxR) {
    html += `<div style="text-align:center;padding:6px;font-size:10px;color:var(--text-secondary);border-top:1px solid var(--border);">Showing ${maxR} of ${rows.length} rows</div>`;
  }
  container.innerHTML = html;
}

function sortTableWidget(widgetId, col) {
  if (window._tableColDragged || window._colResized) return;
  const w = S.widgets.find(ww => ww.id === widgetId);
  if (!w || w.type !== 'table') return;
  if (w.config.sortCol === col) w.config.sortAsc = !w.config.sortAsc;
  else { w.config.sortCol = col; w.config.sortAsc = true; }
  renderWidgets();
  if (currentSettingsId === widgetId) reopenSettings();
}

  menu.innerHTML = html;

function _colCtxOutside(e) {
  const menu = document.getElementById('colCtxMenu');
  if (menu && !menu.contains(e.target)) hideColCtxMenu();
}
function hideColCtxMenu() {
  document.getElementById('colCtxMenu').style.display = 'none';
  document.removeEventListener('mousedown', _colCtxOutside);
}
function applyColCtxMenu(widgetId, col) {
  const w = S.widgets.find(ww => ww.id === widgetId);
  if (!w) return;
  const c = w.config;
  if (!c.colFormats) c.colFormats = {};
  const isChartAxis = col.startsWith('__axis_');
  const metaLabels = { __market:'Market', __media:'Media Type', __sheet:'Sheet' };
  const origLabel = isChartAxis ? (col === '__axis_y' ? (c.yLabel || 'Value Axis') : (c.xLabel || 'Category Axis')) : (metaLabels[col] || col);
  const rename = document.getElementById('ccmRename')?.value?.trim();
  const fmt = document.getElementById('ccmFormat')?.value || '';
  const dec = document.getElementById('ccmDecimals');
  const prefix = document.getElementById('ccmPrefix')?.value || '';
  const suffix = document.getElementById('ccmSuffix')?.value || '';
  const compact = document.getElementById('ccmCompact')?.value || '';
  const aggEl = document.getElementById('ccmAgg');
  const aggVal = aggEl ? aggEl.value : '';

  if (isChartAxis) {
    if (col === '__axis_y') c.yLabel = rename || '';
    else c.xLabel = rename || '';
    if (fmt || (dec && dec.value !== '') || prefix || suffix || compact) {
      const cf = {};
      if (fmt) cf.format = fmt;
      if (dec && dec.value !== '') cf.decimals = parseInt(dec.value);
      if (prefix) cf.prefix = prefix;
      if (suffix) cf.suffix = suffix;

    if (suffix) cf.suffix = suffix;

function valCtxExclude(widgetId, col, val) {
  const w = S.widgets.find(ww => ww.id === widgetId);
  if (!w) return;
  if (!w.config.filters) w.config.filters = [];
  let f = w.config.filters.find(ff => ff.col === col);
  if (!f) {
    const unique = [...new Set(getWidgetRows(w).map(r => String(r[col] ?? '')))];
    f = { col, vals: unique };
    w.config.filters.push(f);
  }
  f.vals = f.vals.filter(v => v !== val);
  if (!f.vals.length) w.config.filters = w.config.filters.filter(ff => ff !== f);
  hideColCtxMenu();
  renderWidgets();
  if (currentSettingsId === widgetId) reopenSettings();
}

function valCtxKeepOnly(widgetId, col, val) {
  const w = S.widgets.find(ww => ww.id === widgetId);
  if (!w) return;
  if (!w.config.filters) w.config.filters = [];
  let f = w.config.filters.find(ff => ff.col === col);
  if (!f) { f = { col, vals: [] }; w.config.filters.push(f); }
  f.vals = [val];
  hideColCtxMenu();
  renderWidgets();
  if (currentSettingsId === widgetId) reopenSettings();
}

function valCtxRename(widgetId, col, val) {
  hideColCtxMenu();
  const newName = prompt('Rename "' + val + '" to:', val);
  if (newName == null || newName === val) return;
  const w = S.widgets.find(ww => ww.id === widgetId);
  if (!w) return;
  if (!w.config.valueRenames) w.config.valueRenames = {};
  if (!w.config.valueRenames[col]) w.config.valueRenames[col] = {};
  if (newName === '') delete w.config.valueRenames[col][val];
  else w.config.valueRenames[col][val] = newName;
  renderWidgets();
}

function buildColFormatter(cf, fallbackFmt) {
  if (!cf) return null;
  const hasFmt = cf.format || cf.compact || cf.prefix || cf.suffix || cf.decimals != null;
  if (!hasFmt) return null;
  const decimals = cf.decimals != null ? cf.decimals : (cf.format === 'percent' || cf.format === 'multiplier' ? 1 : 0);
  const prefix = cf.prefix || (cf.format === 'currency' ? '€' : '');
  const suffix = cf.suffix || (cf.format === 'percent' ? '%' : '');
  const compact = cf.compact || 'never';

  return function(v) {
    if (v == null || isNaN(v)) return '';
    let num = cf.format === 'multiplier' ? v * 100 : v;
    let compactSuffix = '';
    if (compact === 'K') { num /= 1e3; compactSuffix = 'K'; }
    else if (compact === 'M') { num /= 1e6; compactSuffix = 'M'; }
    else if (compact === 'B') { num /= 1e9; compactSuffix = 'B'; }
    else if (compact !== 'never' && Math.abs(num) >= 1e3) {
      if (Math.abs(num) >= 1e9) { num /= 1e9; compactSuffix = 'B'; }
      else if (Math.abs(num) >= 1e6) { num /= 1e6; compactSuffix = 'M'; }
      else if (Math.abs(num) >= 1e3) { num /= 1e3; compactSuffix = 'K'; }
    }
    const useDecimals = compactSuffix ? Math.max(decimals, 1) : decimals;
    let str = Math.abs(num).toFixed(useDecimals);
    const parts = str.split('.');
    let intPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    str = parts[1] ? intPart + '.' + parts[1] : intPart;
    if (num < 0 || (v < 0 && num === 0)) str = '-' + str;
    return prefix + str + compactSuffix + suffix;
  };
}

  e.preventDefault();
  const th = e.target.closest('th');
  if (!th || !_tableColDragData || !th.dataset.wid) return;
  th.style.borderLeft = '';
  const wid = _tableColDragData.wid;
  const fromCol = _tableColDragData.col;
  const toCol = th.dataset.col;
  if (fromCol === toCol) return;

  const w = S.widgets.find(ww => ww.id === wid);
  if (!w || w.type !== 'table') return;

  const wRows = getWidgetRows(w);
  let currentOrder;
  if (w.config.columnOrder && w.config.columnOrder.length) {
    currentOrder = w.config.columnOrder.filter(co => w.config.columns.includes(co));
    w.config.columns.filter(co => !currentOrder.includes(co)).forEach(co => currentOrder.push(co));
  } else {
    const validCols = w.config.columns.filter(col => S.allCols.includes(col) || col === '__market' || col === '__media' || col === '__sheet');
    const textCols = validCols.filter(col => !isNumericCol(col, wRows));
    const numCols = validCols.filter(col => isNumericCol(col, wRows));
    currentOrder = [...textCols, ...numCols];
  }

  const fromIdx = currentOrder.indexOf(fromCol);
  const toIdx = currentOrder.indexOf(toCol);
  if (fromIdx === -1 || toIdx === -1) return;
  currentOrder.splice(fromIdx, 1);
  currentOrder.splice(toIdx, 0, fromCol);
  w.config.columnOrder = currentOrder;

  _tableColDragData = null;
  renderWidgets();
  if (currentSettingsId === wid) reopenSettings();
}

let _colResizeState = null;
function tableColResizeStart(e, widgetId, col) {
  e.stopPropagation();
  e.preventDefault();
  const th = e.target.closest('th');
  if (!th) return;
  const startX = e.clientX;
  const startW = th.offsetWidth;
  const handle = e.target;
  handle.classList.add('active');
  document.body.style.cursor = 'col-resize';
  document.body.style.userSelect = 'none';

  _colResizeState = { widgetId, col, th, startX, startW, handle };

  document.addEventListener('mousemove', tableColResizeMove);
  document.addEventListener('mouseup', tableColResizeEnd);
}
function tableColResizeMove(e) {
  if (!_colResizeState) return;
  const s = _colResizeState;
  const newW = Math.max(30, s.startW + (e.clientX - s.startX));
  s.th.style.width = newW + 'px';
  s.th.style.minWidth = newW + 'px';
  s.th.style.maxWidth = newW + 'px';
}
function tableColResizeEnd(e) {
  if (!_colResizeState) return;
  const s = _colResizeState;
  const newW = Math.max(30, s.startW + (e.clientX - s.startX));
  s.handle.classList.remove('active');
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
  document.removeEventListener('mousemove', tableColResizeMove);
  document.removeEventListener('mouseup', tableColResizeEnd);

  const w = S.widgets.find(ww => ww.id === s.widgetId);
  if (w) {
    if (!w.config.colWidths) w.config.colWidths = {};
    w.config.colWidths[s.col] = newW;
  }
  _colResizeState = null;
  window._colResized = true;
  setTimeout(() => { window._colResized = false; }, 100);
}

function renderChartWidget(w) {
  const c = w.config;
  const wRows = getWidgetRows(w);
  const canvasId = 'canvas-'+w.id;
  if (chartInstances[w.id]) { chartInstances[w.id].destroy(); delete chartInstances[w.id]; }
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;

  if (!c.metrics || !c.metrics.length) {
    const parent = canvas.parentElement;
    if (parent) parent.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-secondary);font-size:12px;">Add metrics in settings to display chart</div>';
    return;
  }

  const dim = c.dimension || S.selectedDimension;
  const agg = aggFn(c.agg);
  const isPie = c.chartType==='pie'||c.chartType==='doughnut';
  const isHoriz = c.chartType==='horizontalBar';
  const type = isHoriz?'bar':c.chartType;

  let datasets, labels, rawLabels;

  function resolveMetFormula(met) {
    if (met.formula && met.formula.trim()) return met.formula;
    const gf = resolveGlobalFormula(met.col);
    return gf || null;
  }

  function metricGroupBy(met) {
    const expr = resolveMetFormula(met);
    if (expr) {
      try { return formulaGroupBy(wRows, dim, expr, c.agg, c.topN); }
      catch(e) { return []; }
    }
    return groupBy(wRows, dim, met.col, agg, c.topN);
  }

  function metricLabel(met) {
    if (met.label) return met.label;
    if (met.formula && met.formula.trim()) return 'Formula';
    const gf = resolveGlobalFormula(met.col);
    if (gf) { const f = (S.globalFormulas||[]).find(f=>'gf:'+f.id===met.col); return f ? f.name : 'Formula'; }
    return met.col;
  }

  if (isPie) {
    const met = c.metrics[0]||{col:'Net Net Spend',color:'#3b82f6'};
    const data = applyGroups(metricGroupBy(met), c.groups);
    rawLabels = data.map(d=>d.label);
    labels = data.map(d=>trunc(d.label));
    datasets = [{ data:data.map(d=>Math.abs(d.value)), backgroundColor:PALETTE.slice(0,data.length), label:metricLabel(met) }];
  } else if (c.metrics.length === 1) {
    const met = c.metrics[0];
    const data = applyGroups(metricGroupBy(met), c.groups);
    rawLabels = data.map(d=>d.label);
    labels = data.map(d=>trunc(d.label));
    const colors = c.signedColors ? data.map(d=>d.value>=0?(met.color||'#3b82f6'):'#ef4444') : data.map(()=>met.color||'#3b82f6');
    datasets = [{ label:metricLabel(met), data:data.map(d=>d.value), backgroundColor:colors, borderColor:type==='line'?(met.color||'#3b82f6'):undefined, borderWidth:type==='line'?2:0, borderRadius:type==='bar'?4:0, maxBarThickness:60, fill:type==='line'?false:undefined, tension:.3, pointRadius:3 }];
  } else {
    const allLabels = new Set();
    const grouped = {};
    wRows.forEach(r => { const k=r[dim]||'(blank)'; (grouped[k]=grouped[k]||[]).push(r); });
    Object.keys(grouped).forEach(k=>allLabels.add(k));
    let labelArr = [...allLabels];
    const firstMetric = c.metrics[0];
    const firstExpr = resolveMetFormula(firstMetric);
    if (firstExpr) {
      try {
        const tokens = tokenizeFormula(firstExpr);
        const ast = parseFormula(tokens);
        labelArr.sort((a,b) => {
          const va = (grouped[a]||[]).reduce((s,r)=>s+evalAST(ast,r),0);
          const vb = (grouped[b]||[]).reduce((s,r)=>s+evalAST(ast,r),0);
          return Math.abs(vb)-Math.abs(va);
        });
      } catch(e) { /* fallback no sort */ }
    } else {
      labelArr.sort((a,b)=>Math.abs(agg(grouped[b]||[],firstMetric.col))-Math.abs(agg(grouped[a]||[],firstMetric.col)));
    }
    labelArr = labelArr.slice(0, c.topN||20);

    if (c.groups && c.groups.length) {
      c.groups.forEach(g => {
        const memberLabels = labelArr.filter(l => g.members.includes(l));
        if (memberLabels.length) {
          labelArr = labelArr.filter(l => !g.members.includes(l));
          labelArr.push(g.name);
          grouped[g.name] = [];
          memberLabels.forEach(ml => { grouped[g.name] = grouped[g.name].concat(grouped[ml] || []); });
        }
      });
    }

    rawLabels = [...labelArr];
    labels = labelArr.map(l=>trunc(l));

    datasets = c.metrics.map((met,i) => {
      let dataArr;
      const metExpr = resolveMetFormula(met);
      if (metExpr) {
        try {
          const tokens = tokenizeFormula(metExpr);
          const ast = parseFormula(tokens);
          const aggType = c.agg || 'sum';
          dataArr = labelArr.map(l => {
            const vals = (grouped[l]||[]).map(r => evalAST(ast,r)).filter(v => isFinite(v));
            if (!vals.length) return 0;
            if (aggType==='avg') return vals.reduce((a,b)=>a+b,0)/vals.length;
            if (aggType==='min') return Math.min(...vals);
            if (aggType==='max') return Math.max(...vals);
            return vals.reduce((a,b)=>a+b,0);
          });
        } catch(e) { dataArr = labelArr.map(()=>0); }
      } else {
        dataArr = labelArr.map(l=>agg(grouped[l]||[],met.col));
      }
      return {
        label:metricLabel(met),
        data:dataArr,
        backgroundColor:met.color||PALETTE[i%PALETTE.length],
        borderColor:type==='line'?(met.color||PALETTE[i%PALETTE.length]):undefined,
        borderWidth:type==='line'?2:0,
        borderRadius:type==='bar'?4:0,
        maxBarThickness:60,
        fill:false, tension:.3, pointRadius:3
      };
    });
  }

  const fontFamily = c.fontFamily||'Inter';
  const fontSize = c.fontSize||11;
  const axisCf = c.colFormats && c.colFormats[isHoriz ? '__axis_x' : '__axis_y'];
  const fmtChartVal = axisCf && axisCf.format ? buildColFormatter(axisCf) : buildChartFormatter(c);

  const dimRenames = c.valueRenames && c.dimension && c.valueRenames[c.dimension];
  if (dimRenames) {
    labels = rawLabels.map(l => { const r = dimRenames[String(l)]; return r != null ? trunc(r) : trunc(l); });
  }

  chartInstances[w.id] = new Chart(canvas.getContext('2d'), {
    type,
    data:{ labels, datasets },
    options:{
      responsive:true, maintainAspectRatio:false,
      indexAxis:isHoriz?'y':undefined,
      plugins:{
        legend:{ display:c.showLegend!==false, position:'top', labels:{ font:{ family:fontFamily, size:fontSize }, usePointStyle:true, padding:12 } },
        tooltip:{ titleFont:{ family:fontFamily }, bodyFont:{ family:fontFamily }, callbacks:{ label:ctx=>{ const v=isPie?datasets[0].data[ctx.dataIndex]:(ctx.parsed.y??ctx.parsed.x); return `${ctx.dataset.label}: ${fmtChartVal(v)}`; } } },
        datalabels: c.showDataLabels ? {
          color: c.dataLabelColor || '#333',
          font: { family: fontFamily, size: Math.max(fontSize - 1, 8), weight: '500' },
          formatter: (v) => fmtChartVal(v),
          anchor: isPie ? 'center' : 'end',
          align: isPie ? 'center' : (isHoriz ? 'right' : 'top'),
          clip: false,
          display: c.dataLabelMinPercent ? function(ctx) {
            const total = ctx.dataset.data.reduce((s,v)=>s+Math.abs(v||0),0);
            return total ? (Math.abs(ctx.dataset.data[ctx.dataIndex]||0)/total*100 >= c.dataLabelMinPercent) : false;
          } : 'auto'
        } : { display: false }
      },
      scales:isPie?{}:{
        x:{ title:{ display:!!c.xLabel, text:c.xLabel||'', font:{ family:fontFamily, size:fontSize+1, weight:'600' } }, ticks:{ font:{ family:fontFamily, size:fontSize }, maxRotation:45 }, grid:{ display:false } },
        y:{ title:{ display:!!c.yLabel, text:c.yLabel||'', font:{ family:fontFamily, size:fontSize+1, weight:'600' } }, ticks:{ font:{ family:fontFamily, size:fontSize }, callback:(v)=>fmtChartVal(v) }, grid:{ display:c.showGrid!==false, color:'#f1f5f9' } }
      },
      onClick: (evt, elements) => chartClickHandler(w.id, evt, elements, rawLabels)
    }
  });
  chartInstances[w.id]._rawLabels = rawLabels;

  canvas.oncontextmenu = function(e) {
    e.preventDefault();
    const chart = chartInstances[w.id];
    if (!chart) return;
    const els = chart.getElementsAtEventForMode(e, 'nearest', { intersect: true }, false);
    if (els.length > 0) {
      const el = els[0];
      const label = rawLabels[el.index];
      const dimCol = c.dimension || '';
      if (label != null && dimCol) {
        showValCtxMenu(w.id, dimCol, String(label), e.clientX, e.clientY);
        return;
      }
    }
    if (isPie) return;
    const axisId = isHoriz ? 'x' : 'y';
    showColCtxMenu(w.id, '__axis_' + axisId, e.clientX, e.clientY);
  };

  if (c.showTotal && datasets.length) {
    const allVals = datasets.flatMap(ds => ds.data || []);
    const totalVal = allVals.reduce((s,v) => s + (Number(v)||0), 0);
    const formatter = buildChartFormatter(c);
    const totalLabel = (c.totalLabel || 'Total') + ': ' + formatter(totalVal);
    const container = canvas.parentElement;
    let totalEl = container.querySelector('.chart-total');
    if (!totalEl) { totalEl = document.createElement('div'); totalEl.className = 'chart-total'; container.appendChild(totalEl); }
    const tPos = c.totalPos || 'bottom-right';
    const posStyle = tPos === 'top-left' ? 'top:4px;left:8px;' : tPos === 'top-right' ? 'top:4px;right:8px;' : tPos === 'bottom-left' ? 'bottom:4px;left:8px;' : 'bottom:4px;right:8px;';
    totalEl.style.cssText = `position:absolute;${posStyle}font-size:${c.totalFontSize||11}px;font-weight:700;color:${c.totalColor||'var(--text-secondary)'};font-family:${c.fontFamily||'Inter'}`;
    totalEl.textContent = totalLabel;
  }
}

function buildChartFormatter(c, forceScale) {
  const decimals = c.valDecimals != null ? c.valDecimals : 0;
  const prefix = c.valPrefix || '';
  const suffix = c.valSuffix || '';
  const compact = c.valCompact || 'never';
  const thouSep = c.valThouSep || 'comma';
  const decSep = c.valDecSep || 'dot';

  return function(v) {
    if (v == null || isNaN(v)) return '';
    let num = v;
    let compactSuffix = '';

    if (forceScale) {
      num = num / forceScale.divisor;
      compactSuffix = forceScale.suffix;
    } else if (compact === 'K') { num = num / 1e3; compactSuffix = 'K'; }
    else if (compact === 'M') { num = num / 1e6; compactSuffix = 'M'; }
    else if (compact === 'B') { num = num / 1e9; compactSuffix = 'B'; }
    else if (compact === 'always' || (compact === 'auto' && Math.abs(num) >= 1000)) {
      if (Math.abs(num) >= 1e9) { num = num / 1e9; compactSuffix = 'B'; }
      else if (Math.abs(num) >= 1e6) { num = num / 1e6; compactSuffix = 'M'; }
      else if (Math.abs(num) >= 1e3) { num = num / 1e3; compactSuffix = 'K'; }
    }

    const useDecimals = compactSuffix ? Math.max(decimals, 1) : decimals;
    let str = Math.abs(num).toFixed(useDecimals);

    const parts = str.split('.');
    let intPart = parts[0];
    const decPart = parts[1] || '';

    if (thouSep !== 'none') {
      const sep = thouSep === 'dot' ? '.' : thouSep === 'space' ? '\u2009' : ',';
      intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, sep);
    }

    const ds = decSep === 'comma' ? ',' : '.';
    str = decPart ? intPart + ds + decPart : intPart;
    if (num < 0 || (v < 0 && num === 0)) str = '-' + str;

    return prefix + str + compactSuffix + suffix;
  };
}

function detectUniformScale(rows, numCols) {
  let maxAbs = 0;
  rows.forEach(r => numCols.forEach(col => { const v = Math.abs(parseFloat(r[col])||0); if (v > maxAbs) maxAbs = v; }));
  if (maxAbs >= 1e9) return {divisor:1e9, suffix:'B'};
  if (maxAbs >= 1e6) return {divisor:1e6, suffix:'M'};
  if (maxAbs >= 1e3) return {divisor:1e3, suffix:'K'};
  return null;
}

/* ═══════════════════════════════════════════
   CHART DATA GROUPING (Tableau-style)
   ═══════════════════════════════════════════ */
const chartSelections = {};

function chartClickHandler(widgetId, evt, elements, labels) {
  if (!elements.length) return;
  const w = S.widgets.find(w => w.id === widgetId);
  if (!w) return;

  if (!chartSelections[widgetId]) chartSelections[widgetId] = new Set();
  const sel = chartSelections[widgetId];
  const idx = elements[0].index;
  const label = labels[idx];

  if (sel.has(label)) sel.delete(label);
  else sel.add(label);

  highlightChartSelection(widgetId);
  updateGroupBar(widgetId);
}

function highlightChartSelection(widgetId) {
  const chart = chartInstances[widgetId];
  if (!chart) return;
  const sel = chartSelections[widgetId] || new Set();
  const chartType = chart.config.type;
  const isPie = chartType === 'pie' || chartType === 'doughnut';
  const isLine = chartType === 'line';

  if (!sel.size) {
    chart.data.datasets.forEach(ds => {
      if (ds._origBg) { ds.backgroundColor = ds._origBg; delete ds._origBg; }
      if (ds._origBorder) { ds.borderColor = ds._origBorder; delete ds._origBorder; }
      if (ds._origPointBg) { ds.pointBackgroundColor = ds._origPointBg; delete ds._origPointBg; }
      if (ds._origPointR) { ds.pointRadius = ds._origPointR; delete ds._origPointR; }
      ds.borderWidth = isLine ? 2 : (isPie ? 0 : 0);
    });
    chart.update('none');
    return;
  }

  const rawLbls = chart._rawLabels || chart.data.labels;
  chart.data.datasets.forEach(ds => {
    if (!ds._origBg) ds._origBg = Array.isArray(ds.backgroundColor) ? [...ds.backgroundColor] : rawLbls.map(() => ds.backgroundColor);

    if (isPie) {
      ds.backgroundColor = rawLbls.map((l, i) => sel.has(l) ? ds._origBg[i % ds._origBg.length] : fadeColor(ds._origBg[i % ds._origBg.length], 0.2));
      ds.borderColor = rawLbls.map((l) => sel.has(l) ? '#1a1a1a' : '#fff');
      ds.borderWidth = rawLbls.map((l) => sel.has(l) ? 3 : 1);
      ds.offset = rawLbls.map((l) => sel.has(l) ? 8 : 0);
    } else if (isLine) {
      if (!ds._origPointBg) ds._origPointBg = ds.pointBackgroundColor || ds.borderColor || ds._origBg[0];
      if (!ds._origPointR) ds._origPointR = ds.pointRadius || 3;
      ds.pointBackgroundColor = rawLbls.map((l) => sel.has(l) ? '#1a1a1a' : (typeof ds._origPointBg === 'string' ? ds._origPointBg : ds._origBg[0]));
      ds.pointRadius = rawLbls.map((l) => sel.has(l) ? 7 : (typeof ds._origPointR === 'number' ? ds._origPointR : 3));
      ds.pointBorderColor = rawLbls.map((l) => sel.has(l) ? '#fff' : 'transparent');
      ds.pointBorderWidth = rawLbls.map((l) => sel.has(l) ? 2 : 0);
    } else {
      ds.backgroundColor = rawLbls.map((l, i) => sel.has(l) ? ds._origBg[i % ds._origBg.length] : fadeColor(ds._origBg[i % ds._origBg.length], 0.25));
      ds.borderColor = rawLbls.map((l) => sel.has(l) ? '#1a1a1a' : 'transparent');
      ds.borderWidth = rawLbls.map((l) => sel.has(l) ? 2 : 0);
    }
  });
  chart.update('none');
}

function fadeColor(color, opacity) {
  if (!color) return `rgba(128,128,128,${opacity})`;
  if (color.startsWith('rgba')) return color.replace(/[\d.]+\)$/, opacity + ')');
  if (color.startsWith('rgb')) return color.replace('rgb', 'rgba').replace(')', `,${opacity})`);
  if (color.startsWith('#')) {
    const hex = color.length === 4 ?
      color[1]+color[1]+color[2]+color[2]+color[3]+color[3] : color.slice(1);
    const r = parseInt(hex.slice(0,2), 16), g = parseInt(hex.slice(2,4), 16), b = parseInt(hex.slice(4,6), 16);
    return `rgba(${r},${g},${b},${opacity})`;
  }
  return color;
}

function updateGroupBar(widgetId) {
  const el = document.getElementById(widgetId);
  if (!el) return;
  const existing = el.querySelector('.group-bar');
  const sel = chartSelections[widgetId] || new Set();

  if (!sel.size) { if (existing) existing.remove(); return; }

  const bar = existing || document.createElement('div');
  bar.className = 'group-bar';
  bar.innerHTML = `<span class="sel-count">${sel.size} selected</span>
    <button onclick="groupSelected('${widgetId}')">Group Selected</button>
    <button class="cancel-btn" onclick="clearChartSelection('${widgetId}')">Clear</button>`;
  if (!existing) el.appendChild(bar);
}

function clearChartSelection(widgetId) {
  if (chartSelections[widgetId]) chartSelections[widgetId].clear();
  highlightChartSelection(widgetId);
  updateGroupBar(widgetId);
}

function groupSelected(widgetId) {
  const sel = chartSelections[widgetId];
  if (!sel || sel.size < 2) { showToast('Select at least 2 items to group'); return; }
  const w = S.widgets.find(w => w.id === widgetId);
  if (!w) return;

  const groupName = prompt('Name for this group:', [...sel].slice(0, 2).join(' + ') + (sel.size > 2 ? ' +...' : ''));
  if (!groupName) return;

  if (!w.config.groups) w.config.groups = [];
  w.config.groups.push({ name: groupName, members: [...sel] });

  chartSelections[widgetId] = new Set();
  renderWidgets();
  showToast(`Grouped ${sel.size} items as "${groupName}"`);
}

function ungroupItem(widgetId, groupIdx) {
  const w = S.widgets.find(w => w.id === widgetId);
  if (!w || !w.config.groups) return;
  w.config.groups.splice(groupIdx, 1);
  renderWidgets();
  if (currentSettingsId === widgetId) reopenSettings();
}

function applyGroups(dataArray, groups) {
  if (!groups || !groups.length) return dataArray;
  let result = [...dataArray];

  groups.forEach(g => {
    const memberItems = result.filter(d => g.members.includes(d.label));
    if (!memberItems.length) return;

    const grouped = {
      label: g.name,
      value: memberItems.reduce((s, d) => s + d.value, 0),
      count: memberItems.reduce((s, d) => s + d.count, 0)
    };
    result = result.filter(d => !g.members.includes(d.label));
    result.push(grouped);
  });

  result.sort((a, b) => Math.abs(b.value) - Math.abs(a.value));
  return result;
}

/* ═══════════════════════════════════════════
   FREEFORM CANVAS DRAG & RESIZE
   ═══════════════════════════════════════════ */
let dragId = null;
let dragOffX = 0, dragOffY = 0;
let isDragging = false;
let isResizing = false;
let resizeId = null;
let resizeStartX = 0, resizeStartY = 0, resizeStartW = 0, resizeStartH = 0;
const SNAP_DIST = 8;

let dragScrollY = 0;

function dragMouseDown(e, id) {
  if (e.target.closest('.widget-actions')) return;
  e.preventDefault();
  dragId = id;
  isDragging = false;

  const w = S.widgets.find(w => w.id === id);
  const grid = document.getElementById('widgetGrid');
  const gridRect = grid.getBoundingClientRect();
  const scroll = document.getElementById('mainContent');

  dragOffX = e.clientX - gridRect.left - w.pos.x;
  dragOffY = e.clientY - gridRect.top - w.pos.y;
  dragScrollY = scroll.scrollTop;

  bringToFront(id);
  document.addEventListener('mousemove', dragMove);
  document.addEventListener('mouseup', dragUp);
}

function dragMove(e) {
  if (!dragId) return;
  isDragging = true;
  const el = document.getElementById(dragId);
  const grid = document.getElementById('widgetGrid');
  const gridRect = grid.getBoundingClientRect();
  const scroll = document.getElementById('mainContent');
  const w = S.widgets.find(w => w.id === dragId);

  let nx = e.clientX - gridRect.left - dragOffX;
  let ny = e.clientY - gridRect.top - dragOffY;

  nx = Math.max(0, nx);
  ny = Math.max(0, ny);

  const snapped = snapPosition(dragId, nx, ny, w.pos.w, w.pos.h);
  nx = snapped.x; ny = snapped.y;

  w.pos.x = Math.round(nx);
  w.pos.y = Math.round(ny);
  el.style.left = w.pos.x + 'px';
  el.style.top = w.pos.y + 'px';
  el.classList.add('is-dragging');

  const maxB = Math.max(...S.widgets.map(ww => (ww.pos ? ww.pos.y + ww.pos.h : 0)));
  grid.style.minHeight = (maxB + 80) + 'px';

  const scrollRect = scroll.getBoundingClientRect();
  if (e.clientY > scrollRect.bottom - 40) scroll.scrollTop += 12;
  if (e.clientY < scrollRect.top + 40) scroll.scrollTop -= 12;
}

function dragUp(e) {
  document.removeEventListener('mousemove', dragMove);
  document.removeEventListener('mouseup', dragUp);
  if (dragId) {
    const el = document.getElementById(dragId);
    if (el) el.classList.remove('is-dragging');
  }
  clearGuides();
  dragId = null;
  isDragging = false;
}

function resizeMouseDown(e, id) {
  e.preventDefault();
  e.stopPropagation();
  isResizing = true;
  resizeId = id;
  resizeStartX = e.clientX;
  resizeStartY = e.clientY;
  const w = S.widgets.find(w => w.id === id);
  resizeStartW = w.pos.w;
  resizeStartH = w.pos.h;
  bringToFront(id);
  document.addEventListener('mousemove', resizeMove);
  document.addEventListener('mouseup', resizeUp);
}

function resizeMove(e) {
  if (!resizeId) return;
  const w = S.widgets.find(w => w.id === resizeId);
  const el = document.getElementById(resizeId);
  const dx = e.clientX - resizeStartX;
  const dy = e.clientY - resizeStartY;
  let newW = Math.max(150, resizeStartW + dx);
  let newH = Math.max(80, resizeStartH + dy);

  const snapped = snapResize(resizeId, w.pos.x, w.pos.y, newW, newH);
  newW = snapped.w; newH = snapped.h;

  w.pos.w = Math.round(newW);
  w.pos.h = Math.round(newH);
  el.style.width = w.pos.w + 'px';
  el.style.height = w.pos.h + 'px';

  if (w.type === 'chart' && chartInstances[w.id]) {
    chartInstances[w.id].resize();
  }
}

function resizeUp(e) {
  document.removeEventListener('mousemove', resizeMove);
  document.removeEventListener('mouseup', resizeUp);
  clearGuides();
  if (resizeId && S.widgets.find(w => w.id === resizeId)?.type === 'chart') {
    renderChartWidget(S.widgets.find(w => w.id === resizeId));
  }
  resizeId = null;
  isResizing = false;
}

function snapResize(id, x, y, w, h) {
  const others = S.widgets.filter(ww => ww.id !== id && ww.pos);
  const grid = document.getElementById('widgetGrid');
  const gw = grid ? grid.clientWidth : 1000;
  let sw = w, sh = h;

  clearGuides();
  const guides = [];

  const rightEdge = x + w;
  const bottomEdge = y + h;

  const vEdges = [0, gw];
  const hEdges = [];
  others.forEach(o => {
    const p = o.pos;
    vEdges.push(p.x, p.x + p.w);
    hEdges.push(p.y, p.y + p.h);
  });

  for (const ve of vEdges) {
    if (Math.abs(rightEdge - ve) < SNAP_DIST) { sw = ve - x; guides.push({ type:'v', pos:ve }); break; }
  }
  for (const he of hEdges) {
    if (Math.abs(bottomEdge - he) < SNAP_DIST) { sh = he - y; guides.push({ type:'h', pos:he }); break; }
  }

  if (guides.length && grid) {
    guides.slice(0, 4).forEach(g => {
      const line = document.createElement('div');
      line.className = 'snap-guide guide-' + g.type;
      if (g.type === 'h') line.style.top = g.pos + 'px';
      else line.style.left = g.pos + 'px';
      grid.appendChild(line);
    });
  }

  return { w: Math.max(150, sw), h: Math.max(80, sh) };
}

function snapPosition(id, x, y, w, h) {
  const others = S.widgets.filter(ww => ww.id !== id && ww.pos);
  const grid = document.getElementById('widgetGrid');
  const gw = grid ? grid.clientWidth : 1000;
  let sx = x, sy = y;

  clearGuides();
  const guides = [];

  const edges = [
    { val: 0, type: 'v' }, { val: gw, type: 'v' }
  ];
  others.forEach(o => {
    const p = o.pos;
    edges.push({ val: p.x, type: 'v' }, { val: p.x + p.w, type: 'v' });
    edges.push({ val: p.y, type: 'h' }, { val: p.y + p.h, type: 'h' });
  });

  for (const e of edges) {
    if (e.type === 'v') {
      if (Math.abs(x - e.val) < SNAP_DIST) { sx = e.val; guides.push({ type:'v', pos:e.val }); }
      if (Math.abs(x + w - e.val) < SNAP_DIST) { sx = e.val - w; guides.push({ type:'v', pos:e.val }); }
    } else {
      if (Math.abs(y - e.val) < SNAP_DIST) { sy = e.val; guides.push({ type:'h', pos:e.val }); }
      if (Math.abs(y + h - e.val) < SNAP_DIST) { sy = e.val - h; guides.push({ type:'h', pos:e.val }); }
    }
  }

  if (guides.length && grid) {
    guides.slice(0, 4).forEach(g => {
      const line = document.createElement('div');
      line.className = 'snap-guide guide-' + g.type;
      if (g.type === 'h') line.style.top = g.pos + 'px';
      else line.style.left = g.pos + 'px';
      grid.appendChild(line);
    });
  }

  return { x: sx, y: sy };
}

function clearGuides() {
  document.querySelectorAll('.snap-guide').forEach(g => g.remove());
}

  document.body.appendChild(menu);

  const mRect = menu.getBoundingClientRect();
  const bRect = e.currentTarget.getBoundingClientRect();

  let left = bRect.right - mRect.width;
  let top = bRect.top - mRect.height - 8;

  if (top < 8) top = bRect.bottom + 8;
  if (left < 8) left = 8;
  if (left + mRect.width > window.innerWidth - 8) left = window.innerWidth - mRect.width - 8;

  menu.style.left = left + 'px';
  menu.style.top = top + 'px';

  setTimeout(() => document.addEventListener('click', function handler(ev) {
    if (menu.contains(ev.target)) return;
    menu.remove();
    document.removeEventListener('click', handler);
  }), 50);
}

  currentSettingsId = id;

function initSearchableSelects() {
  const panel = document.getElementById('panelBody');
  if (!panel) return;
  panel.querySelectorAll('select:not(.ss-done)').forEach(sel => {
    if (sel.options.length < 8) return;
    sel.classList.add('ss-done');
    const wrap = document.createElement('div');
    wrap.className = 'searchable-select-wrap';
    sel.parentElement.insertBefore(wrap, sel);

    const input = document.createElement('input');
    input.className = 'ss-filter';
    input.type = 'text';
    input.placeholder = 'Search...';
    const selIdx = sel.selectedIndex >= 0 ? sel.selectedIndex : 0;
    input.value = sel.options[selIdx] ? sel.options[selIdx].textContent : '';

    const dd = document.createElement('div');
    dd.className = 'ss-dropdown';

    function buildOpts(filter) {
      dd.innerHTML = '';
      const q = (filter || '').toLowerCase();
      Array.from(sel.options).forEach((opt, i) => {
        const text = opt.textContent;
        if (q && !text.toLowerCase().includes(q)) return;
        const div = document.createElement('div');
        div.className = 'ss-option' + (i === sel.selectedIndex ? ' active' : '');
        div.textContent = text;
        div.addEventListener('mousedown', e => {
          e.preventDefault();
          sel.selectedIndex = i;
          sel.dispatchEvent(new Event('change'));
          input.value = text;
          wrap.classList.remove('open');
        });
        dd.appendChild(div);
      });
    }

    input.addEventListener('focus', () => { buildOpts(''); wrap.classList.add('open'); input.select(); });
    input.addEventListener('input', () => { buildOpts(input.value); wrap.classList.add('open'); });
    input.addEventListener('blur', () => {
      setTimeout(() => {
        wrap.classList.remove('open');
        const idx = sel.selectedIndex >= 0 ? sel.selectedIndex : 0;
        input.value = sel.options[idx] ? sel.options[idx].textContent : '';
      }, 150);
    });

    wrap.appendChild(input);
    wrap.appendChild(dd);
    sel.style.display = 'none';
    wrap.appendChild(sel);
  });

  panel.querySelectorAll('.searchable-list-filter').forEach(f => f.remove());
  panel.querySelectorAll('div[style*="max-height"]').forEach(box => {
    const labels = box.querySelectorAll('label');
    if (labels.length < 8) return;
    const filter = document.createElement('input');
    filter.type = 'text';
    filter.className = 'searchable-list-filter';
    filter.placeholder = 'Filter...';
    filter.addEventListener('input', () => {
      const q = filter.value.toLowerCase();
      labels.forEach(lbl => {
        lbl.style.display = lbl.textContent.toLowerCase().includes(q) ? '' : 'none';
      });
    });
    box.parentElement.insertBefore(filter, box);
  });
}

function filterSettings(query) {
  const body = document.getElementById('panelBody');
  if (!body) return;
  const sections = body.querySelectorAll('.settings-section');
  if (!query || !query.trim()) {
    sections.forEach(s => s.classList.remove('search-hidden'));
    return;
  }
  const q = query.toLowerCase().trim();
  const expandedTerms = [q];
  Object.entries(SETTINGS_SYNONYMS).forEach(([syn, target]) => {
    if (q.includes(syn) || syn.includes(q)) expandedTerms.push(target);
  });

  sections.forEach(sec => {
    const text = sec.textContent.toLowerCase();
    const match = expandedTerms.some(term => text.includes(term));
    sec.classList.toggle('search-hidden', !match);
    if (match) sec.classList.add('open');
  });
}

function updateSetting(key, value) {
  const w = S.widgets.find(w=>w.id===currentSettingsId);
  if (!w) return;
  if (key==='posW') { if(!w.pos) assignDefaultPosition(w); w.pos.w = Math.max(150, parseInt(value)||300); }
  else if (key==='posH') { if(!w.pos) assignDefaultPosition(w); w.pos.h = Math.max(80, parseInt(value)||200); }
  else { w.config[key]=value; }
  renderWidgets();
  reopenSettings();
}

function reopenSettings() {
  if (!currentSettingsId) return;
  const body = document.getElementById('panelBody');
  const openSections = new Set();
  if (body) body.querySelectorAll('.settings-section.open').forEach(s => openSections.add(s.id));
  openSettings(currentSettingsId);
  if (openSections.size) {
    const newBody = document.getElementById('panelBody');
    newBody.querySelectorAll('.settings-section').forEach(s => {
      if (openSections.has(s.id)) s.classList.add('open');
      else s.classList.remove('open');
    });
  }
  fixIndeterminateCheckboxes();
}
function fixIndeterminateCheckboxes() {
  document.querySelectorAll('[data-indeterminate]').forEach(cb => { cb.indeterminate = true; });
}

    el.style.background = value;

function updateMetricLive(idx, key, value) {
  const w = S.widgets.find(w => w.id === currentSettingsId);
  if (!w || w.type !== 'chart') return;
  w.config.metrics[idx][key] = value;
  if (key === 'color' && chartInstances[w.id]) {
    const chart = chartInstances[w.id];
    const ds = chart.data.datasets[idx];
    if (ds) {
      const isPie = w.config.chartType === 'pie' || w.config.chartType === 'doughnut';
      const isLine = w.config.chartType === 'line';
      if (isPie) {
        if (!Array.isArray(ds.backgroundColor)) ds.backgroundColor = chart.data.labels.map((_, i) => PALETTE[i % PALETTE.length]);
      } else if (isLine) {
        ds.borderColor = value;
        ds.pointBackgroundColor = value;
      } else {
        if (w.config.signedColors !== false) {
          ds.backgroundColor = ds.data.map(v => v >= 0 ? value : '#ef4444');
        } else {
          ds.backgroundColor = value;
        }
      }
      chart.update('none');
    }
  }
}

function applyThemePreset(themeKey) {
  const w = S.widgets.find(w => w.id === currentSettingsId);

  w.config.borderWidth = t.borderWidth;
  w.config.borderRadius = t.borderRadius;

  w.config.headerBg = t.headerBg;

  if (w.type === 'kpi') w.config.accentColor = t.headerColor;

}

function buildTextSettingsHTML(w) {

function buildWidgetFilterHTML(w) {
  const filters = w.config.filters || [];
  const wCols = getWidgetCols(w);
  const allCols = wCols.filter(c => !c.startsWith('__')).sort((a,b)=>a.localeCompare(b));
  allCols.unshift('__market','__media','__sheet');
  const colLabels = {__market:'Market',__media:'Media Type',__sheet:'Sheet'};

  let html = '';
  for (let i = 0; i < 3; i++) {
    const f = filters[i] || {col:'',vals:[]};
    const colOpts = '<option value="">— none —</option>' + allCols.map(c => `<option value="${c}"${c===f.col?' selected':''}>${colLabels[c]||c}</option>`).join('');
    let valsHTML = '';
    if (f.col) {
      const wRows = getWidgetRows(w, true);
      const unique = [...new Set(wRows.map(r => String(r[f.col] ?? '')))].sort();
      valsHTML = '<div style="max-height:120px;overflow-y:auto;border:1px solid var(--border);border-radius:4px;padding:4px;margin-top:4px;">'
        + unique.map(v => `<label style="display:block;font-size:10px;padding:1px 0;cursor:pointer;"><input type="checkbox" ${f.vals.includes(v)?'checked':''} onchange="toggleWidgetFilter(${i},'${v.replace(/'/g,"\\'")}',this.checked)"> ${v||'(blank)'}</label>`).join('')
        + '</div>';
    }
    html += `<div style="margin-bottom:8px;padding-bottom:8px;${i<2?'border-bottom:1px dashed var(--border);':''}">
      <div class="field"><label>Filter ${i+1}</label><select onchange="setWidgetFilterCol(${i},this.value)">${colOpts}</select></div>
      ${valsHTML}
    </div>`;
  }
  return html;
}

function setWidgetFilterCol(idx, col) {
  const w = S.widgets.find(w => w.id === currentSettingsId);
  if (!w) return;
  if (!w.config.filters) w.config.filters = [];
  while (w.config.filters.length <= idx) w.config.filters.push({col:'',vals:[]});
  if (col) {
    const wRows = getWidgetRows(w, true);
    const unique = [...new Set(wRows.map(r => String(r[col] ?? '')))];
    w.config.filters[idx] = {col, vals:[...unique]};
  } else {
    w.config.filters[idx] = {col:'',vals:[]};
  }
  w.config.filters = w.config.filters.filter(f => f.col);
  renderWidgets();
  reopenSettings();
}

function toggleWidgetFilter(idx, val, checked) {
  const w = S.widgets.find(w => w.id === currentSettingsId);
  if (!w || !w.config.filters || !w.config.filters[idx]) return;
  const f = w.config.filters[idx];
  if (checked && !f.vals.includes(val)) f.vals.push(val);
  else f.vals = f.vals.filter(v => v !== val);
  renderWidgets();
  reopenSettings();
}

function globalFormulaOpts(selected) {
  if (!S.globalFormulas || !S.globalFormulas.length) return '';
  const valid = S.globalFormulas.filter(f => f.expr && f.expr.trim());
  if (!valid.length) return '';
  return '<optgroup label="Global Formulas">' + valid.map(f => {
    const val = 'gf:' + f.id;
    return `<option value="${val}"${selected===val?' selected':''}>${esc(f.name)}</option>`;
  }).join('') + '</optgroup>';
}

       + sec('📄', 'Source Sheets', buildSourceSheetsHTML(w), !!(w.config.sourceSheets&&w.config.sourceSheets.length))
       + sec('🔍', 'Widget Filters', buildWidgetFilterHTML(w), !!(w.config.filters&&w.config.filters.length))

       + sec('#', 'Value Formatting', valFmtSection, false)

       + sec('📐', 'Size &amp; Position', layoutSection, false)
       + sec('🎨', 'Display &amp; Options', displaySection, false)
       + sec('🔗', 'Data Groups', groupsSection, !!(c.groups && c.groups.length))
       + sec('🖼', 'Container Style', buildContainerStyleHTML(w), false);
  
}

function getWidgetCols(w) {
  const ss = w.config.sourceSheets;
  if (ss == null) return S.allCols;
  if (ss.length === 0) return [];
  const colSet = new Set();
  S.files.forEach(f => f.sheets.forEach(sh => {
    if (sh.enabled && ss.includes(f.fileName + '|||' + sh.name) && sh.columns) {
      sh.columns.forEach(c => colSet.add(c));
    }
  }));
  return [...colSet];
}

function buildTableAggMetricsHTML(w) {
  const c = w.config;
  const numericCols = S.allCols.filter(col => !col.startsWith('__')).sort((a,b)=>a.localeCompare(b));
  const metrics = c.aggMetrics || [];
  let html = '<div class="field"><label>Aggregated Columns</label>';
  html += '<div style="max-height:140px;overflow-y:auto;">';
  metrics.forEach((am, i) => {
    const colOpts = numericCols.map(col => `<option ${col===am.col?'selected':''}>${col}</option>`).join('');
    const aggOpts = ['sum','avg','min','max'].map(a => `<option ${a===(am.agg||c.agg||'sum')?'selected':''}>${a}</option>`).join('');
    html += `<div style="display:flex;gap:4px;align-items:center;margin-bottom:3px;">
      <select style="flex:1;font-size:10px;" onchange="updateTableAggMetric(${i},'col',this.value)">${colOpts}</select>
      <select style="width:60px;font-size:10px;" onchange="updateTableAggMetric(${i},'agg',this.value)">${aggOpts}</select>
      <button class="remove-metric" onclick="removeTableAggMetric(${i})" title="Remove">✕</button>
    </div>`;
  });

function toggleTableCol(col, checked) {
  const w = S.widgets.find(ww => ww.id === currentSettingsId);
  if (!w || w.type !== 'table') return;
  if (!w.config.columns) w.config.columns = [];
  if (checked && !w.config.columns.includes(col)) w.config.columns.push(col);
  else if (!checked) w.config.columns = w.config.columns.filter(c => c !== col);
  renderWidgets();
}

function selectAllTableCols(selectAll) {
  const w = S.widgets.find(ww => ww.id === currentSettingsId);
  if (!w || w.type !== 'table') return;
  if (selectAll) {
    w.config.columns = ['__market','__media','__sheet', ...S.allCols.filter(c=>!c.startsWith('__')).sort((a,b)=>a.localeCompare(b))];
  } else {
    w.config.columns = [];
  }
  renderWidgets();
  reopenSettings();
}

function addTableAggMetric() {
  const w = S.widgets.find(ww => ww.id === currentSettingsId);
  if (!w || w.type !== 'table') return;
  if (!w.config.aggMetrics) w.config.aggMetrics = [];
  const numericCols = S.allCols.filter(c => !c.startsWith('__')).sort((a,b)=>a.localeCompare(b));
  const used = w.config.aggMetrics.map(m => m.col);
  const next = numericCols.find(c => !used.includes(c)) || numericCols[0] || '';
  w.config.aggMetrics.push({ col: next, agg: w.config.agg || 'sum' });
  renderWidgets();
  reopenSettings();
}

function removeTableAggMetric(idx) {
  const w = S.widgets.find(ww => ww.id === currentSettingsId);
  if (!w || w.type !== 'table') return;
  w.config.aggMetrics.splice(idx, 1);
  renderWidgets();
  reopenSettings();
}

function updateTableAggMetric(idx, key, value) {
  const w = S.widgets.find(ww => ww.id === currentSettingsId);
  if (!w || w.type !== 'table') return;
  if (!w.config.aggMetrics) return;
  w.config.aggMetrics[idx][key] = value;
  renderWidgets();
}

function addMetric() {
  const w = S.widgets.find(w=>w.id===currentSettingsId);
  if (!w || w.type!=='chart') return;
  const wc = getWidgetCols(w);
  const available = METRIC_COLS.filter(m=>wc.includes(m));
  const used = w.config.metrics.map(m=>m.col);
  const next = available.find(m=>!used.includes(m)) || available[0];
  w.config.metrics.push({ col:next, color:PALETTE[w.config.metrics.length % PALETTE.length] });
  if (w.config.metrics.length > 1) w.config.showLegend = true;
  renderWidgets();
  reopenSettings();
}

function addFormulaMetric() {
  const w = S.widgets.find(w=>w.id===currentSettingsId);
  if (!w || w.type!=='chart') return;
  w.config.metrics.push({ col:'Net Net Spend', formula:'', label:'Custom', color:PALETTE[w.config.metrics.length % PALETTE.length] });
  if (w.config.metrics.length > 1) w.config.showLegend = true;
  renderWidgets();
  reopenSettings();
}

function removeMetric(idx) {
  const w = S.widgets.find(w=>w.id===currentSettingsId);
  if (!w || w.type!=='chart' || w.config.metrics.length<=1) return;
  w.config.metrics.splice(idx,1);
  renderWidgets();
  reopenSettings();
}

function toggleChartMetric(col, checked) {
  const w = S.widgets.find(w=>w.id===currentSettingsId);
  if (!w || w.type!=='chart') return;
  if (checked) {
    const idx = w.config.metrics.length;
    w.config.metrics.push({ col, color: PALETTE[idx % PALETTE.length] });
    if (w.config.metrics.length > 1) w.config.showLegend = true;
  } else {
    w.config.metrics = w.config.metrics.filter(m => m.col !== col);
    if (!w.config.metrics.length) w.config.metrics.push({ col:'', color: PALETTE[0] });
  }
  renderWidgets();
  reopenSettings();
}

function updateChartMetricColor(col, color) {
  const w = S.widgets.find(w=>w.id===currentSettingsId);
  if (!w || w.type!=='chart') return;
  const met = w.config.metrics.find(m => m.col === col);
  if (met) { met.color = color; renderWidgets(); }
}

function updateMetric(idx, key, value) {
  const w = S.widgets.find(w=>w.id===currentSettingsId);
  if (!w || w.type!=='chart') return;
  w.config.metrics[idx][key] = value;
  renderWidgets();
  reopenSettings();
}

function getDimOptions() {
  const metaCols = [{col:'__market',label:'Market'},{col:'__media',label:'Media Type'},{col:'__sheet',label:'Sheet'}];
  const dims = GOOD_DIMS.filter(d=>S.allCols.includes(d));
  S.allCols.filter(c=>!c.startsWith('__')&&!METRIC_COLS.includes(c)&&!dims.includes(c)).forEach(c=>dims.push(c));
  dims.sort((a,b)=>a.localeCompare(b));
  metaCols.forEach(m => dims.unshift(m.col));
  return dims;
}
const DIM_LABELS = {__market:'Market',__media:'Media Type',__sheet:'Sheet'};
function dimLabel(d) { return DIM_LABELS[d] || d; }
