/* ═══════════════════════════════════════════
   SAVE / LOAD LAYOUT (file-based)
   ═══════════════════════════════════════════ */
function saveDashboardToFile(includeData) {
  const name = prompt('Name this layout:', 'My Dashboard');
  if (!name) return;

  const filesMeta = S.files.map(f => ({
    fileName: f.fileName,
    market: f.meta.market,
    media: f.meta.media,
    sheets: f.sheets.map(sh => ({ name:sh.name, enabled:sh.enabled, rowCount:sh.rowCount, headerRow:sh.headerRow || 0 }))
  }));

  const tabsData = S.tabs.map(t => ({
    id: t.id, name: t.name,
    widgets: t.widgets,
    dashHeader: t.dashHeader,
    activeMarkets: [...t.activeMarkets],
    activeMediaTypes: [...t.activeMediaTypes],
    activeAnalysis: [...t.activeAnalysis],
    selectedDimension: t.selectedDimension
  }));

  const data = {
    _type: 'intersnack-dashboard-layout',
    _version: 4,
    name: name,
    savedAt: new Date().toISOString(),
    includesData: !!includeData,
    tabs: tabsData,
    activeTabId: S.activeTabId,
    dashBgColor: S.dashBgColor || '#f5f3f0',
    globalFormulas: S.globalFormulas || [],
    tableVisibleCols: S.tableVisCols,
    filesMeta: filesMeta
  };

  if (includeData && S.files.length) {
    showLoading('Packaging data...');
    (async () => {
      data.filesData = [];
      const metaKeys = new Set(['__file','__sheet','__market','__media']);
      for (let fi = 0; fi < S.files.length; fi++) {
        const f = S.files[fi];
        const fileData = { fileName: f.fileName, meta: f.meta, sheets: [] };
        let wb = null;
        for (const sh of f.sheets) {
          await new Promise(r => setTimeout(r, 0));
          let rows = sh.rows;
          if (!rows && f.buffer && f.buffer.byteLength) {
            try {
              const bufCopy = f.buffer.buffer.slice(0);
              const parsed = await workerRequest({
                action:'parseSheet', buffer:bufCopy,
                id: f._workerId,
                fileName:f.fileName, market:f.meta.market, media:f.meta.media,
                sheetName:sh.name, headerRow:sh.headerRow || 0
              });
              rows = parsed.rows;
            } catch(e) { console.warn('Could not parse sheet for save:', sh.name, e); }
          }
          if (!rows) { fileData.sheets.push({ name: sh.name, enabled: sh.enabled, columns: sh.columns || [], rows: [], headerRow: sh.headerRow || 0 }); continue; }
          const cols = sh.columns || Object.keys(rows[0]||{}).filter(k => !metaKeys.has(k));
          const cleanRows = [];
          for (let ri = 0; ri < rows.length; ri++) {
            const r = rows[ri];
            const clean = {};
            for (let ci = 0; ci < cols.length; ci++) {
              const k = cols[ci];
              if (r[k] !== undefined) clean[k] = r[k];
            }
            cleanRows.push(clean);
            if (ri % 5000 === 0 && ri > 0) await new Promise(r => setTimeout(r, 0));
          }
          fileData.sheets.push({ name: sh.name, enabled: sh.enabled, columns: cols, rows: cleanRows, headerRow: sh.headerRow || 0 });
        }
        data.filesData.push(fileData);
      }
      downloadLayout(data, name);
      hideLoading();
    })();
  } else {
    downloadLayout(data, name);
  }
}

function downloadLayout(data, name) {
  const json = JSON.stringify(data);
  const blob = new Blob([json], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const safeName = name.replace(/[^a-zA-Z0-9_ -]/g, '').replace(/\s+/g, '_');
  const suffix = data.includesData ? '_with-data' : '';
  a.download = `dashboard-layout_${safeName}${suffix}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  const sizeMB = (json.length / 1048576).toFixed(1);
  showToast(`Layout saved: ${a.download} (${sizeMB} MB)`);
}

function loadDashboardFromFile(file) {
  showLoading('Loading layout...');
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (data._type !== 'intersnack-dashboard-layout') {
        hideLoading();
        alert('This file is not a valid dashboard layout.');
        return;
      }

      Object.keys(chartInstances).forEach(k => { chartInstances[k].destroy(); delete chartInstances[k]; });

      // V4+ with tabs
      if (data.tabs && data.tabs.length) {
        S.tabs = data.tabs.map(t => ({
          ...makeTab(t.id, t.name),
          widgets: t.widgets || [],
          dashHeader: t.dashHeader ? {...DEFAULT_DASH_HEADER, ...t.dashHeader} : {...DEFAULT_DASH_HEADER},
          activeMarkets: new Set(t.activeMarkets || []),
          activeMediaTypes: new Set(t.activeMediaTypes || []),
          activeAnalysis: new Set(t.activeAnalysis || ['Yes']),
          selectedDimension: t.selectedDimension || 'Brand'
        }));
        S.activeTabId = data.activeTabId || S.tabs[0].id;
        tabIdCounter = Math.max(...S.tabs.map(t => parseInt(t.id.replace('t','')) || 0)) + 1;
        if (data.dashBgColor) S.dashBgColor = data.dashBgColor;
        if (data.globalFormulas) { S.globalFormulas = data.globalFormulas; gfId = Math.max(1, ...S.globalFormulas.map(f => parseInt(f.id.replace('gf',''))||0)) + 1; }
      }
      // V3 legacy (flat widgets)
      else if (data.widgets && data.widgets.length) {
        const tab = makeTab('t0', 'Overview');
        tab.widgets = data.widgets;
        if (data.dashHeader) tab.dashHeader = {...DEFAULT_DASH_HEADER, ...data.dashHeader};
        if (data.selectedDimension) tab.selectedDimension = data.selectedDimension;
        S.tabs = [tab];
        S.activeTabId = 't0';
      }

      wid = Math.max(...S.widgets.map(w => parseInt(w.id.replace('w','')) || 0), 0) + 1;
      if (data.tableVisibleCols) S.tableVisCols = data.tableVisibleCols;

      // Restore data if included
      if (data.includesData && data.filesData && data.filesData.length) {
        (async () => {
          S.files = [];
          for (let fi = 0; fi < data.filesData.length; fi++) {
            const fd = data.filesData[fi];
            await new Promise(r => setTimeout(r, 0));
            const sheets = [];
            if (fd.sheets && fd.sheets.length) {
              fd.sheets.forEach(sh => {
                const isEnabled = sh.enabled !== false;
                const rows = isEnabled ? sh.rows.map(r => {
                  r.__file = fd.fileName; r.__sheet = sh.name;
                  r.__market = fd.meta.market; r.__media = fd.meta.media;
                  return r;
                }) : null;
                sheets.push({ name:sh.name, enabled:isEnabled, rows:isEnabled ? rows : null, columns:isEnabled ? sh.columns : null, rowCount:isEnabled ? (rows||[]).length : sh.rowCount || 0, headerRow: sh.headerRow || 0 });
              });
            } else if (fd.rows) {
              const sheetName = fd.sheetNames ? fd.sheetNames[0] : 'Data';
              const rows = fd.rows.map(r => {
                r.__file = fd.fileName; r.__sheet = sheetName;
                r.__market = fd.meta.market; r.__media = fd.meta.media;
                return r;
              });
              sheets.push({ name:sheetName, enabled:true, rows, columns:fd.columns, rowCount:rows.length });
            }
            S.files.push({ fileName:fd.fileName, meta:fd.meta, buffer:null, sheets });
          }
          rebuildAllRows();
          S.activeMarkets = new Set();
          S.activeMediaTypes = new Set();
          rebuildFilters();
          applyFilters();
          renderAll();
          hideLoading();
          showToast('Layout + data loaded: ' + (data.name || 'Untitled') + ' (' + S.allRows.length + ' rows)');
        })();
      } else {
        applyFilters();
        renderAll();
        hideLoading();

        if (data.filesMeta && data.filesMeta.length) {
          S._pendingFilesMeta = data.filesMeta;
          const loaded = S.files.map(f => f.fileName);
          const missing = data.filesMeta.filter(fm => !loaded.includes(fm.fileName));
          if (missing.length) {
            const list = missing.map(m => `  - ${m.fileName} (${m.market} / ${m.media})`).join('\n');
            alert('Layout loaded! But these data files are needed:\n\n' + list + '\n\nPlease drag & drop them onto the dashboard.');
          } else {
            showToast('Layout loaded: ' + (data.name || 'Untitled'));
          }
        } else {
          showToast('Layout loaded: ' + (data.name || 'Untitled'));
        }
      }
    } catch(err) {
      hideLoading();
      console.error(err);
      alert('Error reading layout file: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function setDashboardBg(color) {
  document.querySelector('.main-content').style.setProperty('--dash-bg', color);
  S.dashBgColor = color;
}

function toggleToolsMenu() {
  document.getElementById('toolsDropdown').classList.toggle('open');
}
function closeToolsMenu() {
  document.getElementById('toolsDropdown').classList.remove('open');
}

if (!S.globalFormulas) S.globalFormulas = [];
let gfId = 1;

function openFormulaManager() {
  document.getElementById('formulaManagerOverlay').classList.add('open');
  renderFormulaManager();
}
function closeFormulaManager() {
  document.getElementById('formulaManagerOverlay').classList.remove('open');
  renderWidgets();
  if (currentSettingsId) reopenSettings();
}

function addGlobalFormula() {
  S.globalFormulas.push({ id:'gf'+(gfId++), name:'Formula '+ S.globalFormulas.length, expr:'', description:'' });
  renderFormulaManager();
}
function removeGlobalFormula(id) {
  S.globalFormulas = S.globalFormulas.filter(f => f.id !== id);
  renderFormulaManager();
}
function updateGlobalFormula(id, key, val) {
  const f = S.globalFormulas.find(f => f.id === id);
  if (f) f[key] = val;
}
function renderFormulaManager() {
  const body = document.getElementById('fmBody');
  if (!S.globalFormulas.length) {
    body.innerHTML = '<div class="fm-empty">No global formulas yet.<br>Click "+ New Formula" to create one that can be used across all charts and cards.</div>';
    return;
  }
  const colHints = S.allCols.slice(0, 12).map(c => '['+c+']').join(', ');
  body.innerHTML = S.globalFormulas.map(f => {
    const validation = f.expr.trim() ? validateFormula(f.expr) : {valid:true};
    const statusHtml = f.expr.trim() ? (validation.valid
      ? '<span style="color:#22c55e;font-size:10px;">&#10003; Valid</span>'
      : '<span style="color:var(--danger);font-size:10px;">&#10007; ' + (validation.error||'Invalid') + '</span>') : '';
    let previewHtml = '';
    if (f.expr.trim() && validation.valid && S.filteredRows.length) {
      try {
        const sample = evalFormulaOnRows(f.expr, S.filteredRows, 'sum');
        previewHtml = '<span style="font-size:10px;color:var(--text-secondary);margin-left:8px;">Preview: ' + Number(sample).toLocaleString(undefined,{maximumFractionDigits:2}) + '</span>';
      } catch(e) {}
    }
    return `<div class="fm-formula-card">
      <div class="fm-row"><label>Name</label><input type="text" value="${esc(f.name)}" onchange="updateGlobalFormula('${f.id}','name',this.value)" placeholder="e.g. Net Savings"></div>
      <div class="fm-row"><label>Formula</label><textarea onchange="updateGlobalFormula('${f.id}','expr',this.value);renderFormulaManager()" placeholder="e.g. [Net Net Spend] - [Out of Scope]">${esc(f.expr)}</textarea></div>
      <div class="fm-row"><label>Notes</label><input type="text" value="${esc(f.description||'')}" onchange="updateGlobalFormula('${f.id}','description',this.value)" placeholder="Optional description"></div>
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div>${statusHtml}${previewHtml}</div>
        <div class="fm-actions"><button class="btn btn-sm" style="color:var(--danger);border:1px solid var(--danger);background:#fff;" onclick="removeGlobalFormula('${f.id}')">Delete</button></div>
      </div>
      ${colHints ? '<div style="font-size:9px;color:var(--text-secondary);margin-top:6px;">Columns: '+colHints+(S.allCols.length>12?' ...':'')+'</div>' : ''}
    </div>`;
  }).join('');
}

function resetDashboard() {
  if (!confirm('Reset dashboard to default layout? This will remove all tabs and widgets.')) return;
  Object.keys(chartInstances).forEach(k => { chartInstances[k].destroy(); delete chartInstances[k]; });
  S.tabs = [makeTab('t0', 'Overview')];
  S.activeTabId = 't0';
  tabIdCounter = 1;
  createDefaultWidgets();
  applyFilters();
  renderAll();
  showToast('Dashboard reset to defaults');
}

/* ═══════════════════════════════════════════
   COPY TO CLIPBOARD (high-res)
   ═══════════════════════════════════════════ */
async function copyWidgetToClipboard(id) {
  const el = document.getElementById(id);
  if (!el) return;
  showToast('Capturing widget...');

  const grip = el.querySelector('.grip');
  const actions = el.querySelector('.widget-actions');
  const resizes = el.querySelectorAll('.widget-resize');
  const h4 = el.querySelector('.widget-handle h4');
  if (grip) grip.style.display = 'none';
  if (actions) actions.style.display = 'none';
  resizes.forEach(r => r.style.display = 'none');
  if (h4) { h4.style.overflow = 'visible'; h4.style.whiteSpace = 'normal'; h4.style.textOverflow = 'unset'; }

  try {
    const canvas = await html2canvas(el, {
      scale: 3,
      useCORS: true,
      backgroundColor: null,
      logging: false,
      removeContainer: true,
    });
    const blob = await canvasToBlob(canvas);
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    showToast('Widget copied to clipboard — paste into PowerPoint');
  } catch(e) {
    console.error(e);
    fallbackDownload(el, 'widget');
  } finally {
    if (grip) grip.style.display = '';
    if (actions) actions.style.display = '';
    resizes.forEach(r => r.style.display = '');
    if (h4) { h4.style.overflow = ''; h4.style.whiteSpace = ''; h4.style.textOverflow = ''; }
  }
}

async function copyDashboardToClipboard() {
  const grid = document.getElementById('widgetGrid');
  if (!grid || !S.widgets.length) { showToast('No widgets to capture'); return; }

  const fabCopy = document.querySelector('.fab-copy');
  if (fabCopy) fabCopy.classList.add('copying');
  showToast('Capturing dashboard (high-res)...');

  const fabAdd = document.querySelector('.fab-add');
  const fabCopyEl = document.querySelector('.fab-copy');
  if (fabAdd) fabAdd.style.display = 'none';
  if (fabCopyEl) fabCopyEl.style.display = 'none';

  document.querySelectorAll('.widget-resize').forEach(r => r.style.visibility = 'hidden');
  document.querySelectorAll('.snap-guide').forEach(g => g.style.display = 'none');
  document.querySelectorAll('.grip').forEach(g => g.style.display = 'none');
  document.querySelectorAll('.widget-actions').forEach(a => a.style.display = 'none');
  document.querySelectorAll('.dh-actions').forEach(a => a.style.display = 'none');
  document.querySelectorAll('.widget-handle h4').forEach(h => { h.style.overflow = 'visible'; h.style.whiteSpace = 'normal'; h.style.textOverflow = 'unset'; });

  try {
    const canvas = await html2canvas(grid, {
      scale: 3,
      useCORS: true,
      backgroundColor: '#f5f2ef',
      logging: false,
      removeContainer: true,
      width: grid.scrollWidth,
      height: grid.scrollHeight,
    });
    const blob = await canvasToBlob(canvas);
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    showToast('Dashboard copied to clipboard — paste into PowerPoint');
  } catch(e) {
    console.error(e);
    fallbackDownload(grid, 'dashboard');
  } finally {
    if (fabAdd) fabAdd.style.display = '';
    if (fabCopyEl) fabCopyEl.style.display = '';
    document.querySelectorAll('.widget-resize').forEach(r => r.style.visibility = '');
    document.querySelectorAll('.grip').forEach(g => g.style.display = '');
    document.querySelectorAll('.widget-actions').forEach(a => a.style.display = '');
    document.querySelectorAll('.dh-actions').forEach(a => a.style.display = '');
    document.querySelectorAll('.widget-handle h4').forEach(h => { h.style.overflow = ''; h.style.whiteSpace = ''; h.style.textOverflow = ''; });
    if (fabCopy) { fabCopy.classList.remove('copying'); }
  }
}

function canvasToBlob(canvas) {
  return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}

async function fallbackDownload(el, name) {
  try {
    const canvas = await html2canvas(el, { scale: 3, useCORS: true, backgroundColor: '#f5f2ef', logging: false });
    const link = document.createElement('a');
    link.download = name + '_' + new Date().toISOString().slice(0,10) + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    showToast('Clipboard not available — downloaded as PNG instead');
  } catch(e2) {
    showToast('Failed to capture: ' + e2.message);
  }
}

function showToast(msg) {
  let t = document.getElementById('toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2D231C;color:#fff;padding:10px 24px;border-radius:8px;font-size:13px;font-weight:500;z-index:200;box-shadow:0 4px 12px rgba(0,0,0,.15);opacity:0;transition:opacity .3s;pointer-events:none;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.opacity = '0'; }, 3000);
}

   DATA TABLE

function renderTable() { }

function exportCSV() {
  if (!S.filteredRows.length) return;
  const mc = ['__market','__media','__sheet'];
  const ml = {__market:'Market',__media:'Media Type',__sheet:'Sheet'};
  const cols = [...mc,...S.allCols.filter(c=>!c.startsWith('__'))];
  let csv = cols.map(c=>`"${(ml[c]||c).replace(/"/g,'""')}"`).join(',')+'\n';
  S.filteredRows.forEach(r=>{ csv += cols.map(c=>`"${String(r[c]??'').replace(/"/g,'""')}"`).join(',')+'\n'; });
  const blob = new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='dashboard_export.csv'; a.click();
}

/* ═══════════════════════════════════════════
   LOADING / DRAG-DROP FILES
   ═══════════════════════════════════════════ */
function showLoading(t) { document.getElementById('loadingText').textContent=t||'Loading...'; document.getElementById('loadingOverlay').classList.add('visible'); }
function hideLoading() { document.getElementById('loadingOverlay').classList.remove('visible'); }

let dragCounter = 0;
function isFileDrag(e) { return !dragId && e.dataTransfer && e.dataTransfer.types && e.dataTransfer.types.indexOf('Files') !== -1; }
document.addEventListener('dragenter', e=>{ e.preventDefault(); if(!isFileDrag(e)) return; dragCounter++; document.getElementById('dropOverlay').classList.add('visible'); });
document.addEventListener('dragleave', e=>{ e.preventDefault(); if(!isFileDrag(e)) return; dragCounter--; if(dragCounter<=0){dragCounter=0;document.getElementById('dropOverlay').classList.remove('visible');} });
document.addEventListener('dragover', e=>e.preventDefault());
document.addEventListener('drop', e=>{ e.preventDefault(); if(dragId) return; dragCounter=0; document.getElementById('dropOverlay').classList.remove('visible'); if(e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });

document.getElementById('uploadZone').addEventListener('click',()=>document.getElementById('fileInput').click());
document.getElementById('browseBtn').addEventListener('click',e=>{e.stopPropagation();document.getElementById('fileInput').click();});
document.getElementById('fileInput').addEventListener('change',e=>{if(e.target.files.length)handleFiles(e.target.files);e.target.value='';});

// Wire up layout file inputs
['layoutFileInput','startLayoutInput'].forEach(id => {
  document.getElementById(id).addEventListener('change', e => {
    if (e.target.files.length) loadDashboardFromFile(e.target.files[0]);
    e.target.value = '';
  });
});

renderAll();
document.addEventListener('click', e => {
  if (!e.target.closest('#toolsDropdown')) closeToolsMenu();
});
